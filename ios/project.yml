name: NoSpam
options:
  bundleIdPrefix: com.konrad
settings:
  base:
    DEVELOPMENT_TEAM: H7477F644K
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  NoSpam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NoSpam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konrad.nospam
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: NoSpam/NoSpam.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.konrad.nospam
    info:
      path: NoSpam/Info.plist
      properties:
        CFBundleDisplayName: NoSpam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Usiamo solo crittografia standard esente (SHA-256 via CryptoKit per
        # l'hash anonimo del dispositivo, HTTPS di sistema) - nessun algoritmo
        # proprietario. Evita il modulo di conformita' export a ogni upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        BGTaskSchedulerPermittedIdentifiers:
          - com.konrad.nospam.refresh
        UIBackgroundModes:
          - fetch
        GADApplicationIdentifier: ca-app-pub-3640143071817482~8948542375
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSUserTrackingUsageDescription: >-
          Questo identificativo viene usato per mostrarti annunci pubblicitari
          piu' pertinenti e per misurarne l'efficacia.
    dependencies:
      - target: NoSpamCallDirectory
        embed: true
      - target: NoSpamMessageFilter
        embed: true
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform

  NoSpamCallDirectory:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NoSpamCallDirectory
      - path: NoSpam/SpamNumberStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konrad.nospam.CallDirectory
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: NoSpamCallDirectory/NoSpamCallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.konrad.nospam
    info:
      path: NoSpamCallDirectory/Info.plist
      properties:
        CFBundleDisplayName: NoSpam CallDirectory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler

  NoSpamMessageFilter:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NoSpamMessageFilter
      - path: NoSpam/SpamNumberStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konrad.nospam.MessageFilter
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: NoSpamMessageFilter/NoSpamMessageFilter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.konrad.nospam
    info:
      path: NoSpamMessageFilter/Info.plist
      properties:
        CFBundleDisplayName: NoSpam MessageFilter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
