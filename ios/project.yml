name: NoSpam
options:
  bundleIdPrefix: com.konrad
targets:
  NoSpam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NoSpam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konrad.nospam
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
