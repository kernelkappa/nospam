name: TEMP verify level column

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Insert and delete a test row with level
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          INSERT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$SUPABASE_URL/rest/v1/error_reports" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"platform":"ci","context":"tmp-verify-migration","message":"test","app_version":"0","os_version":"ci","level":"info"}')
          BODY=$(echo "$INSERT_RESPONSE" | head -n -1)
          STATUS=$(echo "$INSERT_RESPONSE" | tail -n1)
          echo "HTTP status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" -ge 300 ]; then
            echo "INSERT FALLITO: la colonna 'level' probabilmente non esiste ancora."
            exit 1
          fi
          ID=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "Riga di test inserita con id=$ID, verifico il contenuto e la cancello..."
          curl -s "$SUPABASE_URL/rest/v1/error_reports?id=eq.$ID&select=level" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
          curl -s -X DELETE "$SUPABASE_URL/rest/v1/error_reports?id=eq.$ID" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
          echo "OK: colonna 'level' esiste e funziona, riga di test rimossa."
