name: Daily log export

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data-ingestion/requirements.txt

      # Stesso pattern di retry del job di raccolta dati: sicuro rilanciare da
      # capo perche' la query e' idempotente e la cancellazione per retention
      # usa sempre la stessa soglia di data, non uno stato intermedio.
      - name: Export logs and apply retention
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RETENTION_DAYS: "30"
        run: |
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if python data-ingestion/export_logs.py; then
              echo "Export riuscito (tentativo $attempt/$max_attempts)."
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Export fallito dopo $max_attempts tentativi, mi fermo qui."
              exit 1
            fi
            echo "Export fallito (tentativo $attempt/$max_attempts), ritento..."
            sleep 30
          done

      - name: Commit exported log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet && exit 0
          git commit -m "chore: esporta log del $(date -u -d yesterday +%Y-%m-%d)"
          git push
