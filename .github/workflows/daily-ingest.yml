name: Daily spam DB aggregation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data-ingestion/requirements.txt

      - name: Run aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python data-ingestion/aggregate.py

      - name: Commit updated spam_db.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/spam_db.json docs/spam_prefixes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: aggiorna spam_db.json e spam_prefixes.json"
          git push
