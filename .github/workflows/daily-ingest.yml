name: Daily spam DB aggregation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r data-ingestion/requirements.txt

      - name: Run aggregation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python data-ingestion/aggregate.py

      - name: Commit updated spam_db.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/spam_db.json docs/spam_prefixes.json
          git diff --cached --quiet && { echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "chore: aggiorna spam_db.json e spam_prefixes.json"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GitHub Pages ("deploy from branch") lancia in automatico il workflow
      # pages-build-deployment ad ogni push su docs/: non e' un workflow
      # nostro quindi non possiamo editarne la definizione, ma possiamo
      # osservarlo via API e ritentarlo se il runner non viene assegnato
      # (capitato una volta, errore transitorio GitHub, non un bug nostro).
      - name: Ritenta il deploy di GitHub Pages se fallisce
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for i in $(seq 1 10); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=pages-build-deployment \
              --json databaseId,headSha -q ".[] | select(.headSha==\"$(git rev-parse HEAD)\") | .databaseId" | head -1)
            [ -n "$run_id" ] && break
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "Nessuna esecuzione di pages-build-deployment trovata per questo commit, salto il controllo."
            exit 0
          fi
          if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "Deploy di GitHub Pages riuscito."
          else
            echo "Deploy di GitHub Pages fallito, ritento una volta..."
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
          fi
